name: "CodeQL"

on:
  push:
    branches: [master, v2019]
    paths-ignore:
      - 'docs/**'
  # Analyze every pull request regardless of base branch, so a stacked PR
  # is not silently unanalyzed.
  pull_request:
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '0 23 * * 1'

# Supersede an in-flight run when the same ref is pushed again. Without this
# every push starts a full matrix and none of the older ones ever stop, so a
# branch pushed a few times in quick succession has several complete runs
# competing for the same runners and starving each other -- which looks
# exactly like a CI outage. The default branch is exempt: master runs are the
# release record and each commit's result is worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Override automatic language detection by changing the below list
        # Supported options are ['csharp', 'cpp', 'go', 'java', 'javascript', 'python']
        language: ['cpp']
        # Learn more...
        # https://docs.github.com/en/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#overriding-automatic-language-detection

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # We must fetch at least the immediate parents so that if this is
        # a pull request then we can checkout the head.
        fetch-depth: 2

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 https://git.io/JvXDl

    - run: |
        sudo apt update
        sudo apt install -y build-essential autoconf automake bison expect libmysqlclient-dev libpcre3-dev libpq-dev libsqlite3-dev libssl-dev libtool libz-dev telnet libgtest-dev libjemalloc-dev pkg-config libffi-dev
        mkdir build && cd build && cmake -DCMAKE_BUILD_TYPE=Debug -DPACKAGE_DB_SQLITE=2 .. && make -j 2 install && cd ..

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
