name: Config Docs

# Verifies that docs/driver/config.md is regenerated whenever the runtime config
# tables in rc.cc change. The doc is generated from INT_FLAGS[] / STR_FLAGS[] by
# docs/gen_config_docs.py; if a contributor edits the tables without re-running
# the generator, this job fails and tells them what to run.

on:
  push:
    branches: [master]
    paths:
      - 'src/base/internal/rc.cc'
      - 'src/base/internal/options_internal.h'
      - 'docs/gen_config_docs.py'
      - 'docs/driver/config.md'
  pull_request:
    paths:
      - 'src/base/internal/rc.cc'
      - 'src/base/internal/options_internal.h'
      - 'docs/gen_config_docs.py'
      - 'docs/driver/config.md'

# Supersede an in-flight run when the same ref is pushed again. Without this
# every push starts a full matrix and none of the older ones ever stop, so a
# branch pushed a few times in quick succession has several complete runs
# competing for the same runners and starving each other -- which looks
# exactly like a CI outage. The default branch is exempt: master runs are the
# release record and each commit's result is worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    name: config.md is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify generated config docs
        run: python3 docs/gen_config_docs.py --check
