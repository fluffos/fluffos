name: Build FluffOS (Windows / MSYS2)
description: >-
  Install MSYS2/MinGW64 dependencies, configure, build and test the Windows
  driver. Shared by the CI `windows` job and the release `build-windows` job
  so the two can't drift. The caller must run msys2/setup-msys2 first and
  default its shell to `msys2 {0}`. Leaves the installed tree in build/bin/
  for the caller to package. Keep the pacman list below in sync with
  README.md's Windows (MSYS2) section.

inputs:
  build-type:
    description: CMake build type.
    default: RelWithDebInfo
  db-sqlite:
    description: PACKAGE_DB_SQLITE mode (1 = bundled, 2 = system libsqlite3).
    default: '2'
  extra-packages:
    description: >-
      Extra pacman packages beyond the shared build set below (e.g. `flex` to
      regenerate the lexer in CI, or `zip` to package the release archive).
    default: ''

runs:
  using: composite
  steps:
    - name: Install dependencies (MSYS2)
      shell: 'msys2 {0}'
      run: |
        pacman --noconfirm -S --needed \
          mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-zlib \
          mingw-w64-x86_64-pcre mingw-w64-x86_64-icu mingw-w64-x86_64-sqlite3 \
          mingw-w64-x86_64-jemalloc mingw-w64-x86_64-gtest \
          mingw-w64-x86_64-pkgconf mingw-w64-x86_64-libffi \
          bison make ${{ inputs.extra-packages }}

    - name: Configure & build
      shell: 'msys2 {0}'
      run: |
        mkdir build && cd build
        cmake -G "MSYS Makefiles" \
          -DCMAKE_BUILD_TYPE=${{ inputs.build-type }} \
          -DMARCH_NATIVE=OFF \
          -DPACKAGE_CRYPTO=OFF \
          -DPACKAGE_DB_MYSQL="" \
          -DPACKAGE_DB_SQLITE=${{ inputs.db-sqlite }} \
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
          ..
        VERBOSE=1 make -j 2 install

    # ---------------------------------------------------------------------
    # TEMPORARY DIAGNOSTIC -- remove before merging.
    #
    # gtest discovery (`<exe> --gtest_list_tests`) prints the complete test
    # list and then exits 3 (MSVCRT abort()) on the current MSYS2 toolchain.
    # CMake's GoogleTestAddTests.cmake only captures stdout, so the abort
    # message is thrown away. Run the binaries by hand with stderr attached,
    # and under gdb, to find out what aborts.
    - name: DIAGNOSTIC -- capture teardown abort
      if: always()
      shell: 'msys2 {0}'
      run: |
        set +e
        cd build
        echo "=================== toolchain versions ==================="
        pacman -Q mingw-w64-x86_64-crt mingw-w64-x86_64-headers \
                  mingw-w64-x86_64-gcc mingw-w64-x86_64-gcc-libs \
                  mingw-w64-x86_64-cmake mingw-w64-x86_64-gtest \
                  mingw-w64-x86_64-binutils mingw-w64-x86_64-jemalloc \
                  mingw-w64-x86_64-icu mingw-w64-x86_64-openssl
        echo "=================== binaries present ==================="
        ls -la src/*.exe src/tests/*.exe 2>&1
        echo
        for exe in src/driver.exe src/lpcc.exe src/o2json.exe src/symbol.exe \
                   src/tests/strutils_tests.exe src/tests/ofile_tests.exe \
                   src/tests/lexer_tests.exe src/tests/compiler_tests.exe \
                   src/tests/lpc_tests.exe; do
          if [ ! -f "$exe" ]; then echo "########## $exe MISSING"; continue; fi
          case "$exe" in
            *tests.exe)  args=--gtest_list_tests ;;
            *driver.exe) args=--generate-config ;;
            *)           args=--help ;;
          esac
          echo "########## $exe $args"
          ./$exe $args >/dev/null 2>/tmp/err.txt
          echo "### exit=$?"
          echo "### stderr:"
          cat /tmp/err.txt
          echo
        done
        echo "=================== gdb: ofile_tests --gtest_list_tests ==================="
        gdb -batch -nx -ex 'set confirm off' -ex 'set pagination off' \
            -ex run -ex 'echo \n==== bt ====\n' -ex 'bt full' \
            -ex 'echo \n==== threads ====\n' -ex 'thread apply all bt' \
            --args ./src/tests/ofile_tests.exe --gtest_list_tests 2>&1 | tail -150
        echo "=================== gdb: driver --generate-config ==================="
        gdb -batch -nx -ex 'set confirm off' -ex 'set pagination off' \
            -ex run -ex 'echo \n==== bt ====\n' -ex 'bt full' \
            --args ./src/driver.exe --generate-config 2>&1 | tail -80
        exit 0

    - name: Run tests
      if: always()
      shell: 'msys2 {0}'
      run: |
        cd build
        ctest --output-on-failure -LE testsuite
        ctest --output-on-failure -L testsuite
