name: Build FluffOS (Windows / MSYS2)
description: >-
  Install MSYS2/MinGW64 dependencies, configure, build and test the Windows
  driver. Shared by the CI `windows` job and the release `build-windows` job
  so the two can't drift. The caller must run msys2/setup-msys2 first and
  default its shell to `msys2 {0}`. Leaves the installed tree in build/bin/
  for the caller to package. Keep the pacman list below in sync with
  README.md's Windows (MSYS2) section.

inputs:
  build-type:
    description: CMake build type.
    default: RelWithDebInfo
  db-sqlite:
    description: PACKAGE_DB_SQLITE mode (1 = bundled, 2 = system libsqlite3).
    default: '2'
  extra-packages:
    description: >-
      Extra pacman packages beyond the shared build set below (e.g. `flex` to
      regenerate the lexer in CI, or `zip` to package the release archive).
    default: ''

runs:
  using: composite
  steps:
    - name: Install dependencies (MSYS2)
      shell: 'msys2 {0}'
      run: |
        pacman --noconfirm -S --needed \
          mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-zlib \
          mingw-w64-x86_64-pcre mingw-w64-x86_64-icu mingw-w64-x86_64-sqlite3 \
          mingw-w64-x86_64-jemalloc mingw-w64-x86_64-gtest \
          mingw-w64-x86_64-pkgconf mingw-w64-x86_64-libffi \
          bison make ${{ inputs.extra-packages }}

    - name: Configure & build
      shell: 'msys2 {0}'
      run: |
        mkdir build && cd build
        cmake -G "MSYS Makefiles" \
          -DCMAKE_BUILD_TYPE=${{ inputs.build-type }} \
          -DMARCH_NATIVE=OFF \
          -DPACKAGE_CRYPTO=OFF \
          -DPACKAGE_DB_MYSQL="" \
          -DPACKAGE_DB_SQLITE=${{ inputs.db-sqlite }} \
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
          ..
        VERBOSE=1 make -j 2 install

    # ---------------------------------------------------------------------
    # TEMPORARY DIAGNOSTIC -- remove before merging, together with the
    # PRE_TEST line above.
    #
    # Every binary this project produced used to run correctly, print its full
    # output, and then terminate with exit code 3 during teardown:
    # ~backward::SignalHandling (a static destructor, since backward.cpp
    # defines a namespace-scope `backward::sh`) threw std::system_error out of
    # std::mutex::lock() -- EINVAL, which mingw-w64 >= r420 returns for a
    # zeroed mutex handle where it used to silently re-initialize it -- and a
    # throw from a noexcept destructor aborts the process. Verify the fix, and
    # if it is still failing, use a watchpoint to name whatever zeroes the
    # mutex handle.
    - name: DIAGNOSTIC -- verify no binary aborts at exit
      if: always()
      shell: 'msys2 {0}'
      run: |
        set +e
        cd build
        pacman -Q mingw-w64-x86_64-crt mingw-w64-x86_64-winpthreads \
                  mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
        echo
        bad=0
        for exe in src/driver.exe src/lpcc.exe src/symbol.exe \
                   src/tests/strutils_tests.exe src/tests/ofile_tests.exe \
                   src/tests/lexer_tests.exe src/tests/compiler_tests.exe \
                   src/tests/lpc_tests.exe; do
          if [ ! -f "$exe" ]; then echo "  $exe MISSING"; continue; fi
          case "$exe" in
            *tests.exe)  args=--gtest_list_tests ;;
            *driver.exe) args=--generate-config ;;
            *)           args=--help ;;
          esac
          ./$exe $args >/dev/null 2>/tmp/err.txt
          rc=$?
          # symbol/lpcc --help legitimately return nonzero; only 3 (abort) matters.
          printf '  %-34s exit=%s %s\n' "$exe" "$rc" \
            "$( [ "$rc" = 3 ] && { echo '<-- STILL ABORTING'; bad=1; } )"
          [ -s /tmp/err.txt ] && sed 's/^/      stderr: /' /tmp/err.txt
        done
        echo
        if [ "$bad" = 1 ]; then
          echo "=== still aborting: watchpoint on the mutex handle ==="
          gdb -batch -nx -ex 'set confirm off' -ex 'set pagination off' \
              -ex 'set breakpoint pending on' \
              -ex 'start' \
              -ex 'watch -l backward::SignalHandling::mtx()::data' \
              -ex 'continue' -ex 'bt' \
              -ex 'continue' -ex 'bt' \
              -ex 'continue' -ex 'bt' \
              --args ./src/tests/strutils_tests.exe --gtest_list_tests 2>&1 | tail -90
        else
          echo "=== no binary exits 3 -- the teardown abort is fixed ==="
        fi
        exit 0

    - name: Run tests
      if: always()
      shell: 'msys2 {0}'
      run: |
        cd build
        ctest --output-on-failure -LE testsuite
        ctest --output-on-failure -L testsuite
